{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-camera"></i> Primeiro passo – Tire uma foto</h4>
            </div>
            <div class="card-body text-center">
                <video id="video" width="100%" autoplay style="border-radius: 10px; border: 2px solid #3498db;"></video>
                <canvas id="canvas" style="display: none;"></canvas>
                <div class="mt-3">
                    <button id="tirar-foto" class="btn btn-success"><i class="fas fa-camera"></i> Tirar foto</button>
                </div>
                <form method="POST" id="form-foto">
                    <input type="hidden" name="foto_base64" id="foto_base64">
                    <button type="submit" id="prosseguir" class="btn btn-primary mt-3" style="display: none;">Prosseguir →</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const tirarFoto = document.getElementById('tirar-foto');
    const fotoInput = document.getElementById('foto_base64');
    const prosseguir = document.getElementById('prosseguir');
    let stream = null;

    // Acessar a câmera
    navigator.mediaDevices.getUserMedia({ video: true })
        .then(function(s) {
            stream = s;
            video.srcObject = stream;
        })
        .catch(function(err) {
            alert('Não foi possível acessar a câmera. Verifique as permissões.');
            console.error(err);
        });

    tirarFoto.addEventListener('click', function() {
        const context = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const dataURL = canvas.toDataURL('image/jpeg');
        fotoInput.value = dataURL;
        // Parar a câmera
        if (stream) {
            stream.getTracks().forEach(track => track.stop());
            video.srcObject = null;
        }
        // Mostrar a foto tirada
        const img = document.createElement('img');
        img.src = dataURL;
        img.style.width = '100%';
        img.style.borderRadius = '10px';
        document.querySelector('.card-body').insertBefore(img, document.querySelector('.mt-3'));
        tirarFoto.style.display = 'none';
        prosseguir.style.display = 'inline-block';
    });
</script>
{% endblock %}
