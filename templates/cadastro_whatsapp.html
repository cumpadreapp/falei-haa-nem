{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow">
            <div class="card-header bg-success text-white text-center">
                <h4><i class="fab fa-whatsapp"></i> Verificação via WhatsApp</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Seu número de WhatsApp (com DDD e DDI)</label>
                        <input type="tel" name="telefone" class="form-control" placeholder="5511999999999" required>
                        <small class="text-muted">Receberá um código de 6 dígitos por WhatsApp.</small>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Enviar código</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{{ url_for('login') }}" class="text-decoration-none">Já tem cadastro? Faça login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
