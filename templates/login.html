{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="fas fa-sign-in-alt"></i> Entrar no Falei, haa Nemm...</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">WhatsApp com DDD</label>
                        <input type="text" name="telefone" class="form-control" placeholder="Ex: 11999999999" required>
                        <small class="text-muted">Administrador: digite "admin"</small>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
                <hr>
                <div class="text-center">
                    <a href="{{ url_for('cadastro_foto') }}" class="btn btn-success w-100">
                        <i class="fas fa-user-plus"></i> Cadastrar-se
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
